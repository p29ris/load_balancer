version: "3.9"
services:
  load_balancer:
    build: ./load_balancer
    privileged: true
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lb_network
  server_1:
    build: ./server
    environment:
      - SERVER_ID=1
    networks:
      - lb_network
  server_2:
    build: ./server
    environment:
      - SERVER_ID=2
    networks:
      - lb_network
  server_3:
    build: ./server
    environment:
      - SERVER_ID=3
    networks:
      - lb_network

networks:
  lb_network:
    driver: bridge
